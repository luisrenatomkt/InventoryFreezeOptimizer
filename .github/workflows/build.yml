name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle itself must run on JDK 17 (the pack200 plugin needs Java 16+).
      # JDK 8 is installed too, and the Gradle toolchain in build.gradle compiles the mod with it.
      # The LAST version listed becomes JAVA_HOME (17); JAVA_HOME_8_X64 is also exported.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: InventoryFreeze
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
